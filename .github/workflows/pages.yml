name: Publish approved test release
on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: User-approved public commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.repository == 'mokuhibi/nemuri-selection-notebook-test'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check approved revision
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
        run: test "$APPROVED_COMMIT" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/core.test.cjs && node tests/board.test.cjs && node tests/berries.test.cjs && node tests/auto.test.cjs && node tests/simulation.test.cjs && node tests/maps.test.cjs && node tests/sources.test.cjs && node tests/assignments.test.cjs && node tests/backup.test.cjs && node tests/environment.test.cjs
      - name: Stage only public application files
        run: |
          mkdir -p _site/licenses
          test -z "$(find assets/pokemon assets/berries -type f -name '*.png' -print)"
          cp index.html style.css note.css share.css environment.js app.js backup.js board.js core.js data.js berries.js manifest.webmanifest favicon.ico _site/
          cp -R assets _site/
          cp DATA_SOURCES.md _site/
          cp licenses/*.txt _site/licenses/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
